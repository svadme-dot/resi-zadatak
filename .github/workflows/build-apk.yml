name: Build Resi Zadatak APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ResiZadatak-project.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi repository
        uses: actions/checkout@v6

      - name: Podesi Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Podesi Android SDK
        uses: android-actions/setup-android@v4

      - name: Instaliraj Android 36 SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Raspakuj i popravi Android projekat
        run: |
          rm -rf work
          mkdir work
          unzip -q ResiZadatak-project.zip -d work

          test -f work/ResiZadatak/settings.gradle.kts
          test -f work/ResiZadatak/app/build.gradle.kts

          python3 <<'PY'
          from pathlib import Path

          p = Path("work/ResiZadatak/app/build.gradle.kts")
          text = p.read_text(encoding="utf-8")

          # GitHub runner trenutno ima stabilni Android API 36.
          text = text.replace("compileSdk = 37", "compileSdk = 36")
          text = text.replace("targetSdk = 37", "targetSdk = 36")

          # Kotlin 2.4 / AGP 9 prijavljuje legacy DSL kao deprecation error.
          suppression = '@file:Suppress("DEPRECATION", "DEPRECATION_ERROR")'

          if suppression not in text:
              text = suppression + "\n\n" + text

          p.write_text(text, encoding="utf-8")

          print("=== build.gradle.kts patched ===")
          for i, line in enumerate(text.splitlines(), 1):
              if (
                  "Suppress" in line
                  or "compileSdk" in line
                  or "targetSdk" in line
                  or "kotlinOptions" in line
              ):
                  print(f"{i}: {line}")
          PY

      - name: Dodaj Gemini API key
        working-directory: work/ResiZadatak
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || {
            echo "GEMINI_API_KEY secret nije postavljen"
            exit 1
          }

          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> local.properties

      - name: Build APK
        working-directory: work/ResiZadatak
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Proveri APK
        working-directory: work/ResiZadatak
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Preimenuj APK
        working-directory: work/ResiZadatak
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/ResiZadatak-debug.apk

      - name: Sacuvaj APK
        uses: actions/upload-artifact@v7
        with:
          name: ResiZadatak-APK
          path: work/ResiZadatak/app/build/outputs/apk/debug/ResiZadatak-debug.apk
          if-no-files-found: error
