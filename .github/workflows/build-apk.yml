name: Build Resi Zadatak APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ResiZadatak-project.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi repository
        uses: actions/checkout@v6

      - name: Podesi Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Podesi Android SDK
        uses: android-actions/setup-android@v4

      - name: Instaliraj Android 36 SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Raspakuj projekat
        run: |
          rm -rf work
          mkdir work
          unzip -q ResiZadatak-project.zip -d work
          test -f work/ResiZadatak/settings.gradle.kts
          test -f work/ResiZadatak/build.gradle.kts
          test -f work/ResiZadatak/app/build.gradle.kts

      - name: Popravi projekat i ukljuci dijagnostiku
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path("work/ResiZadatak")
          top = root / "build.gradle.kts"
          app = root / "app/build.gradle.kts"
          gemini = root / "app/src/main/java/com/resizadatak/app/data/remote/GeminiAiService.kt"
          repo = root / "app/src/main/java/com/resizadatak/app/data/repository/ChatRepository.kt"
          screen = root / "app/src/main/java/com/resizadatak/app/ui/chat/ChatScreen.kt"
          styles = root / "app/src/main/res/values/styles.xml"

          # KAPT -> KSP
          t = top.read_text(encoding="utf-8")
          t = t.replace(
              'id("org.jetbrains.kotlin.kapt") version "2.4.10" apply false',
              'id("com.google.devtools.ksp") version "2.3.10" apply false'
          )
          top.write_text(t, encoding="utf-8")

          # Ranije build popravke.
          a = app.read_text(encoding="utf-8")
          a = a.replace("compileSdk = 37", "compileSdk = 36")
          a = a.replace("targetSdk = 37", "targetSdk = 36")
          a = a.replace('id("org.jetbrains.kotlin.kapt")', 'id("com.google.devtools.ksp")')
          a = a.replace('kapt("androidx.room:room-compiler:2.8.4")', 'ksp("androidx.room:room-compiler:2.8.4")')
          a = a.replace('kapt { correctErrorTypes = true }', '')
          a = a.replace('implementation("androidx.core:core-ktx:1.19.0")', 'implementation("androidx.core:core-ktx:1.17.0")')
          a = a.replace('implementation("androidx.activity:activity-compose:1.13.0")', 'implementation("androidx.activity:activity-compose:1.12.4")')
          a = a.replace('implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.11.0")', 'implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.10.0")')
          a = a.replace('implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0")', 'implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0")')

          suppression = '@file:Suppress("DEPRECATION", "DEPRECATION_ERROR")'
          if suppression not in a:
              a = suppression + "\n\n" + a

          resolution = """
          configurations.configureEach {
              resolutionStrategy.eachDependency {
                  when (requested.group) {
                      "androidx.lifecycle" -> useVersion("2.10.0")
                      "androidx.core" -> if (
                          requested.name == "core" ||
                          requested.name == "core-ktx"
                      ) {
                          useVersion("1.17.0")
                      }
                  }
              }
          }

          """
          if "resolutionStrategy.eachDependency" not in a:
              a = a.replace("dependencies {", resolution + "dependencies {", 1)
          app.write_text(a, encoding="utf-8")

          # Gemini syntax fix.
          g = gemini.read_text(encoding="utf-8")
          g = g.replace("throw@withContext AiServiceException", "throw AiServiceException")
          gemini.write_text(g, encoding="utf-8")

          # Theme fix.
          s = styles.read_text(encoding="utf-8")
          s = s.replace("android:style/Theme.DeviceDefault.DayNight.NoActionBar", "android:style/Theme.Material.NoActionBar")
          styles.write_text(s, encoding="utf-8")

          # ChatRepository dijagnostika: OVO JE TACAN BLOK IZ ORIGINALNOG ZIP-a.
          r = repo.read_text(encoding="utf-8")
          old_repo = """            } catch (e: AiServiceException) {
                          dao.updateMessageStatus(userMessageId, MessageStatus.ERROR, e.kind.name)
                      } catch (_: Throwable) {
                          dao.updateMessageStatus(userMessageId, MessageStatus.ERROR, AiErrorKind.UNKNOWN.name)
                      }"""
          new_repo = """            } catch (e: AiServiceException) {
                          val detail = e.cause?.message ?: e.message ?: "Nema dodatne poruke."
                          val imageInfo = turns.mapNotNull { turn ->
                              turn.imagePath?.let { path ->
                                  val file = java.io.File(path)
                                  val kb = file.length() / 1024.0
                                  val mime = turn.imageMimeType ?: "nepoznat MIME"
                                  "$mime, %.1f KB".format(kb)
                              }
                          }.joinToString("; ")

                          val diagnostic = buildString {
                              append(e.kind.name)
                              append("|||")
                              append(detail.take(1800))
                              if (imageInfo.isNotBlank()) {
                                  append("\\nSlika: ")
                                  append(imageInfo)
                              }
                          }
                          dao.updateMessageStatus(userMessageId, MessageStatus.ERROR, diagnostic.take(2400))
                      } catch (e: Throwable) {
                          val imageInfo = turns.mapNotNull { turn ->
                              turn.imagePath?.let { path ->
                                  val file = java.io.File(path)
                                  val kb = file.length() / 1024.0
                                  val mime = turn.imageMimeType ?: "nepoznat MIME"
                                  "$mime, %.1f KB".format(kb)
                              }
                          }.joinToString("; ")

                          val diagnostic = buildString {
                              append(AiErrorKind.UNKNOWN.name)
                              append("|||")
                              append(e.javaClass.simpleName)
                              append(": ")
                              append((e.message ?: "Nema poruke.").take(1800))
                              if (imageInfo.isNotBlank()) {
                                  append("\\nSlika: ")
                                  append(imageInfo)
                              }
                          }
                          dao.updateMessageStatus(userMessageId, MessageStatus.ERROR, diagnostic.take(2400))
                      }"""
          if old_repo not in r:
              raise RuntimeError("ChatRepository catch blok nije pronadjen")
          r = r.replace(old_repo, new_repo, 1)
          repo.write_text(r, encoding="utf-8")

          # ChatScreen: prikazi detalj.
          c = screen.read_text(encoding="utf-8")
          old_error = """private fun errorText(kind: String?): String = when (kind) {
              AiErrorKind.NO_INTERNET.name -> "Nema internet veze. Proveri vezu i pokušaj ponovo."
              AiErrorKind.RATE_LIMIT.name -> "Trenutno je dostignut limit za AI servis. Pokušaj ponovo malo kasnije."
              AiErrorKind.INVALID_KEY.name -> "AI servis nije pravilno podešen. Proveri API ključ u aplikaciji."
              else -> "Nešto nije uspelo. Pokušaj ponovo."
          }"""
          new_error = """private fun errorText(raw: String?): String {
              val parts = raw.orEmpty().split("|||", limit = 2)
              val kind = parts.firstOrNull().orEmpty()
              val detail = parts.getOrNull(1)?.trim().orEmpty()

              val normal = when (kind) {
                  AiErrorKind.NO_INTERNET.name -> "Problem sa internet vezom ili mrežnim zahtevom."
                  AiErrorKind.RATE_LIMIT.name -> "Dostignut je limit za AI servis."
                  AiErrorKind.INVALID_KEY.name -> "Problem sa API ključem ili pristupom modelu."
                  AiErrorKind.TEMPORARY.name -> "Privremena greška Gemini servisa."
                  else -> "Gemini zahtev nije uspeo."
              }

              return if (detail.isBlank()) normal
              else "$normal\\n\\nDIJAGNOSTIKA:\\n${detail.take(1900)}"
          }"""
          if old_error not in c:
              raise RuntimeError("ChatScreen errorText blok nije pronadjen")
          c = c.replace(old_error, new_error, 1)
          screen.write_text(c, encoding="utf-8")

          assert 'id("com.google.devtools.ksp")' in app.read_text(encoding="utf-8")
          assert 'ksp("androidx.room:room-compiler:2.8.4")' in app.read_text(encoding="utf-8")
          assert "compileSdk = 36" in app.read_text(encoding="utf-8")
          assert "Theme.Material.NoActionBar" in styles.read_text(encoding="utf-8")
          assert 'append("|||")' in repo.read_text(encoding="utf-8")
          assert "DIJAGNOSTIKA:" in screen.read_text(encoding="utf-8")
          print("DIJAGNOSTICKI PATCH USPESNO PRIMENJEN")
          PY

      - name: Dodaj Gemini API key
        working-directory: work/ResiZadatak
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || {
            echo "GEMINI_API_KEY secret nije postavljen"
            exit 1
          }
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> local.properties

      - name: Build APK
        working-directory: work/ResiZadatak
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Proveri APK
        working-directory: work/ResiZadatak
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Preimenuj APK
        working-directory: work/ResiZadatak
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/ResiZadatak-debug.apk

      - name: Sacuvaj APK
        uses: actions/upload-artifact@v7
        with:
          name: ResiZadatak-APK
          path: work/ResiZadatak/app/build/outputs/apk/debug/ResiZadatak-debug.apk
          if-no-files-found: error

      - name: Sacuvaj build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ResiZadatak-build-log
          path: work/ResiZadatak/build.log
          if-no-files-found: ignore
