<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f8fb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Matematika">
<meta name="application-name" content="Matematika">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<title>Matematika</title>
<style>html,body{margin:0;height:100%;background:#f7f8fb;font-family:system-ui,sans-serif}body{display:grid;place-items:center;color:#687386}</style>
</head>
<body><div>Pokrećem Matematiku…</div>
<script>
(async()=>{
 const files=['./app-v5/part-0.txt?v=6', './app-v5/part-1.txt?v=6', './app-v5/part-2.txt?v=6', './app-v5/part-3.txt?v=6', './app-v5/part-4.txt?v=6', './app-v5/part-5a.txt?v=6', './app-v5/part-5b.txt?v=6', './app-v5/part-6.txt?v=6', './app-v5/part-7.txt?v=6']; let b64="";
 for(const file of files){const r=await fetch(file,{cache:"no-store"});if(!r.ok)throw new Error("Nedostaje "+file);b64+=await r.text();}
 const bin=atob(b64.trim());const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
 const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));let html=await new Response(stream).text();
 const needle='      system_instruction: SYSTEM_INSTRUCTION,\n      generation_config: {';
 const replacement='      system_instruction: SYSTEM_INSTRUCTION,\n      tools: [\n        { type: "code_execution" },\n        { type: "google_search" }\n      ],\n      generation_config: {';
 if(!html.includes(needle))throw new Error("Gemini tools patch nije pronađen u aplikaciji.");
 html=html.replace(needle,replacement);

 // Google Search grounding nije dostupan na besplatnom Gemini API tieru.
 // Probaj oba alata, ali ako Search vrati 429, odmah ponovi isti zahtev
 // samo sa Code Execution umesto da se potroše retry-i i sva četiri ključa.
 const nativeFetch=window.fetch.bind(window);
 const searchUnavailableKeys=new Set();
 window.fetch=async(input,init={})=>{
   const url=typeof input==="string"?input:(input&&input.url)||"";
   if(!url.includes("generativelanguage.googleapis.com/v1beta/interactions")||typeof init.body!=="string"){
     return nativeFetch(input,init);
   }

   let body;
   try{body=JSON.parse(init.body);}catch{return nativeFetch(input,init);}

   const hasSearch=Array.isArray(body.tools)&&
     body.tools.some(tool=>tool&&tool.type==="google_search");
   if(!hasSearch)return nativeFetch(input,init);

   const headers=init.headers||{};
   const key=typeof headers.get==="function"
     ?(headers.get("x-goog-api-key")||"")
     :(headers["x-goog-api-key"]||headers["X-Goog-Api-Key"]||"");

   const withoutSearch=()=>{
     const fallbackBody={...body,tools:body.tools.filter(tool=>tool&&tool.type!=="google_search")};
     return {...init,body:JSON.stringify(fallbackBody)};
   };

   if(searchUnavailableKeys.has(key)){
     return nativeFetch(input,withoutSearch());
   }

   const response=await nativeFetch(input,init);
   if(response.status!==429)return response;

   const fallback=await nativeFetch(input,withoutSearch());
   if(fallback.ok)searchUnavailableKeys.add(key);
   return fallback;
 };

 document.open();document.write(html);document.close();
})().catch(e=>{document.body.innerHTML="<div style='padding:24px'>Ne mogu da pokrenem aplikaciju: "+String(e)+"</div>";});
</script></body></html>
